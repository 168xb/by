name: 接口搬运备份

on:
  schedule:
    - cron: '0 3 * * *'  # 每天 UTC 03:00 = 北京时间 11:00
  workflow_dispatch:

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-interfaces:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: pip install requests urllib3

    - name: 创建必要目录
      run: |
        mkdir -p ry
        echo "必要目录已创建"

    - name: 清空ry目录
      run: |
        if [ -d "ry" ]; then
          rm -rf ry/*
          echo "ry目录已清空"
        else
          echo "ry目录不存在，跳过清空"
        fi

    - name: 每日解析在线本地包
      continue-on-error: true
      run: python python/ry下载器.py

    - name: tvbox接口解密更新
      run: python python/tvbox_get_api.py

    - name: 提交变更
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "更新接口数据 [skip ci]" || echo "没有变更可提交"
        git push