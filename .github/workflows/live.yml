name: 直播源聚合

on:
  # 上游「接口搬运备份」完成后自动触发
  workflow_run:
    workflows: ["接口搬运备份"]   # 必须与 main.yml 顶部的 name 完全一致
    types:
      - completed

  # 手动触发
  workflow_dispatch:

concurrency:
  group: live-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 如果是被上游 workflow_run 触发的，只有上游成功时才运行；手动触发不受影响
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    env:
      PRIVATE_REPO: '168xb/jkby'
      PRIVATE_BRANCH: 'main'

    steps:
      # ========== 1. 检出当前仓库 ==========
      - name: 检出当前仓库 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========== 2. 设置 Python 环境 ==========
      - name: 设置Python环境 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========== 3. 安装依赖 ==========
      - name: 安装依赖 📦
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ========== 4. 从私库复制全部文件（排除 .git）==========
      - name: 从私库复制全部文件 📦
        run: |
          set -e
          echo "开始克隆私有仓库 ${PRIVATE_REPO} (branch: ${PRIVATE_BRANCH}) ..."
          git clone --depth 1 --branch "${PRIVATE_BRANCH}" \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git" \
            /tmp/private-repo

          echo "私库根目录内容:"
          ls -la /tmp/private-repo

          # 复制私库全部文件到工作目录（覆盖同名文件），但排除 .git
          # 使用 rsync 精确排除 .git，避免污染当前仓库
          rsync -a --exclude='.git' /tmp/private-repo/ ${{ github.workspace }}/

          # 清理私库克隆
          rm -rf /tmp/private-repo

          echo "私库全部文件已复制到工作目录（已排除 .git）"

      # ========== 4.1 校验当前仓库 .git 完好 ==========
      - name: 校验当前仓库 .git 未被污染 ✅
        run: |
          set -e
          echo "当前 remote:"
          git remote -v

          CURRENT_REMOTE="$(git remote get-url origin)"
          echo "origin url = ${CURRENT_REMOTE}"

          if echo "${CURRENT_REMOTE}" | grep -q "${PRIVATE_REPO}"; then
            echo "错误: 当前仓库的 origin 被私库污染了！"
            exit 1
          fi
          echo "校验通过: origin 仍指向当前仓库"

      # ========== 5. 确保目录结构存在 ==========
      - name: 确保目录结构存在 🗂️
        run: |
          mkdir -p tvbox/live
          mkdir -p python
          ls -la
          echo "--- tvbox/ ---"
          ls -la tvbox/ || true

      # ========== 6. 清空 tvbox/live 目录 ==========
      - name: 清空tvbox/live目录 🧹
        run: |
          if [ -d "tvbox/live" ]; then
            rm -rf tvbox/live/*
            echo "tvbox/live目录已清空"
          else
            echo "tvbox/live目录不存在，跳过清空"
          fi

      # ========== 7. 执行脚本 ==========
      - name: 运行直播源下载工具 ▶️
        run: |
          cd python
          python "live直播源下载.py" --force
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      # ========== 8. 汇总输出产物 ==========
      - name: 汇总输出产物 📊
        run: |
          echo "=== 根目录 txt ==="
          ls -la *.txt 2>/dev/null || echo "无 txt 文件"
          echo ""
          echo "=== tvbox/ 聚合接口 ==="
          ls -la tvbox/*.json 2>/dev/null || echo "无 json 文件"
          echo ""
          echo "=== tvbox/live/ 播放列表 ==="
          ls -la tvbox/live/ 2>/dev/null | head -20 || echo "无播放列表"

      # ========== 9. 提交回当前仓库（排除 data 和 python 目录）==========
      - name: 提交变更 🚀
        run: |
          set -e

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 先把不需要提交的目录从工作区移除，避免 rebase 冲突
          rm -rf data/ python/ 2>/dev/null || true

          git add -A
          git reset -- data/ python/ || true   # 双保险

          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi

          COUNT=$(git diff --cached --numstat | wc -l)
          echo "检测到 ${COUNT} 个文件变更，提交中..."
          git commit -m "chore: 更新聚合直播 [$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')] [skip ci]"

          if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
            echo "错误: git pull --rebase 失败，可能有冲突，终止推送"
            exit 1
          fi

          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "错误: git push 失败"
            exit 1
          fi

          echo "已成功提交到当前仓库"