name: 直播源聚合

on:
  # 上游「接口搬运备份」完成后自动触发
  workflow_run:
    workflows: ["接口搬运备份"]   # 必须与 main.yml 顶部的 name 完全一致
    types:
      - completed

  # 手动触发
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 如果是被上游 workflow_run 触发的，只有上游成功时才运行；手动触发不受影响
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 确保目录结构存在
        run: |
          mkdir -p tvbox/live
          mkdir -p python
          ls -la
          echo "--- tvbox/ ---"
          ls -la tvbox/ || true

      - name: 清空tvbox/live目录
        run: |
          if [ -d "tvbox/live" ]; then
            rm -rf tvbox/live/*
            echo "tvbox/live目录已清空"
          else
            echo "tvbox/live目录不存在，跳过清空"
          fi

      - name: 运行直播源下载工具
        run: |
          cd python
          python "live直播源下载.py" --force
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: 汇总输出产物
        run: |
          echo "=== 根目录 txt ==="
          ls -la *.txt 2>/dev/null || echo "无 txt 文件"
          echo ""
          echo "=== tvbox/ 聚合接口 ==="
          ls -la tvbox/*.json 2>/dev/null || echo "无 json 文件"
          echo ""
          echo "=== tvbox/live/ 播放列表 ==="
          ls -la tvbox/live/ 2>/dev/null | head -20 || echo "无播放列表"

      - name: 提交变更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            COUNT=$(git diff --cached --numstat | wc -l)
            echo "检测到 ${COUNT} 个文件变更，提交中..."
            git commit -m "chore: 更新聚合直播 [$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')]"
            git push
          fi